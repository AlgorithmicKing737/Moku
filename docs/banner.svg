  <defs>

    <linearGradient id="bgGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#101f17"/>
      <stop offset="55%" stop-color="#0a150f"/>
      <stop offset="100%" stop-color="#060c08"/>
    </linearGradient>

    <radialGradient id="heroGlow" cx="50%" cy="42%" r="50%">
